<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3TO FOREST INTERFACE | DARK MODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-deep: #0a0f0d;
            --emerald: #10b981;
            --glass: rgba(15, 20, 18, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--forest-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Background dengan gradasi hutan gelap */
            background: 
                linear-gradient(to bottom, rgba(10, 15, 13, 0.8), rgba(10, 15, 13, 0.95)),
                url('https://images.unsplash.com/photo-1511497584788-876760111969?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* --- CONTAINER UTAMA --- */
        .app-shell {
            width: 1100px;
            height: 750px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            display: grid;
            grid-template-columns: 380px 1fr;
            box-shadow: 0 50px 100px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* --- SIDEBAR CONFIG --- */
        .sidebar {
            padding: 40px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }

        .brand {
            display: flex; align-items: center; gap: 15px; margin-bottom: 40px;
        }

        .brand img {
            width: 45px; height: 45px; border-radius: 12px;
            object-fit: cover; border: 1.5px solid var(--emerald);
        }

        .brand h2 { font-size: 1.1rem; letter-spacing: -0.5px; font-weight: 700; }

        .form-section { flex: 1; overflow-y: auto; padding-right: 10px; }

        .input-group { margin-bottom: 24px; }
        .input-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase;
        }

        input, textarea {
            width: 100%; background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 12px 16px; color: #fff; font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none; border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.05);
        }

        .action-area { padding-top: 30px; }

        .btn-deploy {
            width: 100%; padding: 16px;
            background: var(--emerald); color: #000;
            border: none; border-radius: 14px;
            font-weight: 700; font-size: 0.9rem;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-deploy:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            filter: brightness(1.1);
        }

        /* --- PREVIEW VIEWPORT --- */
        .preview-area {
            padding: 60px;
            display: flex; flex-direction: column;
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.05), transparent);
        }

        .preview-label {
            font-size: 0.7rem; color: var(--text-dim); font-weight: 700;
            margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
        }

        .preview-label::before {
            content: ''; width: 6px; height: 6px; background: var(--emerald); border-radius: 50%;
        }

        .discord-card {
            background: #2b2d31;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            border-left: 4px solid var(--emerald);
            align-self: center; margin-top: auto; margin-bottom: auto;
        }

        .ds-header { display: flex; gap: 16px; margin-bottom: 8px; }
        .ds-avatar { width: 44px; height: 44px; border-radius: 50%; background: #404249; }
        
        .embed-content { margin-left: 60px; }
        .embed-title { font-weight: 700; font-size: 1rem; color: #fff; margin-bottom: 4px; }
        .embed-desc { color: #dbdee1; font-size: 0.9rem; line-height: 1.4; white-space: pre-wrap; }
        .embed-banner { width: 100%; border-radius: 8px; margin-top: 16px; }

        /* Custom Scrollbar */
        .form-section::-webkit-scrollbar { width: 4px; }
        .form-section::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="app-shell">
        <!-- KONFIGURASI -->
        <aside class="sidebar">
            <div class="brand">
                <img src="eeff593c85e4d36ffb0fa63dfaebcfb5.jpg" alt="Mixo">
                <div>
                    <h2>P3TO SYSTEM</h2>
                    <p style="font-size: 0.65rem; color: var(--emerald); font-weight: 700;">OPERATOR: MIXO</p>
                </div>
            </div>

            <div class="form-section">
                <div class="input-group">
                    <label>Webhook Destination</label>
                    <input type="text" id="webhook" placeholder="Paste URL here...">
                </div>

                <div class="input-group">
                    <label>Embed Title</label>
                    <input type="text" id="title" placeholder="Transmission Title">
                </div>

                <div class="input-group">
                    <label>Message Content</label>
                    <textarea id="desc" rows="6" placeholder="Write your neural transmission..."></textarea>
                </div>

                <div class="input-group">
                    <label>Banner URL</label>
                    <input type="text" id="banner" placeholder="https://image.path/...">
                </div>

                <div class="input-group">
                    <label>Signature Color</label>
                    <input type="color" id="color" value="#10b981" style="height: 45px; padding: 4px; cursor: pointer;">
                </div>
            </div>

            <div class="action-area">
                <button class="btn-deploy" id="sendBtn">SEND TO DISCORD</button>
            </div>
        </aside>

        <!-- PREVIEW -->
        <main class="preview-area">
            <div class="preview-label">REAL-TIME VISUALIZER</div>
            
            <div class="discord-card" id="card">
                <div class="ds-header">
                    <div class="ds-avatar"></div>
                    <div>
                        <span style="font-weight: 700; font-size: 0.95rem;">P3TO BOT</span>
                        <span style="background: #5865f2; font-size: 0.6rem; padding: 2px 4px; border-radius: 3px; margin-left: 4px;">APP</span>
                        <span style="color: #949ba4; font-size: 0.75rem; margin-left: 8px;">Today at 08:56</span>
                    </div>
                </div>
                <div class="embed-content">
                    <div class="embed-title" id="p-title">System Online</div>
                    <div class="embed-desc" id="p-desc">Awaiting operator input...</div>
                    <img src="" id="p-banner" class="embed-banner" style="display: none;">
                </div>
            </div>

            <div style="margin-top: auto; color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono';">
                STATUS: ENCRYPTED // LINK: STABLE
            </div>
        </main>
    </div>

    <script>
        const inputs = ['title', 'desc', 'color', 'banner'];
        
        function update() {
            const title = document.getElementById('title').value || "System Online";
            const desc = document.getElementById('desc').value || "Awaiting operator input...";
            const color = document.getElementById('color').value;
            const banner = document.getElementById('banner').value;

            document.getElementById('p-title').innerText = title;
            document.getElementById('p-desc').innerText = desc;
            document.getElementById('card').style.borderColor = color;
            
            const imgEl = document.getElementById('p-banner');
            if(banner) {
                imgEl.src = banner;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
        }

        inputs.forEach(id => document.getElementById(id).addEventListener('input', update));

        document.getElementById('sendBtn').onclick = async () => {
            const btn = document.getElementById('sendBtn');
            const webhook = document.getElementById('webhook').value;
            if(!webhook) return alert("Halt! Webhook URL is missing.");

            btn.innerText = "LINKING...";
            btn.disabled = true;

            const payload = {
                embeds: [{
                    title: document.getElementById('title').value,
                    description: document.getElementById('desc').value,
                    color: parseInt(document.getElementById('color').value.replace('#',''), 16),
                    image: { url: document.getElementById('banner').value },
                    footer: { text: "OPERATED BY MIXO" },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const res = await fetch(webhook, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    btn.innerText = "TRANSMITTED";
                    setTimeout(() => {
                        btn.innerText = "SEND TO DISCORD";
                        btn.disabled = false;
                    }, 2000);
                }
            } catch(e) {
                alert("Failed to link.");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
