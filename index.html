<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Discord Embed Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top left,#5865f2 0%,transparent 25%),
    radial-gradient(circle at bottom right,#8f5cff 0%,transparent 25%),
    #0f1117;
    min-height:100vh;
    color:white;
    overflow-x:hidden;
}

.container{
    display:grid;
    grid-template-columns: 420px 1fr;
    gap:30px;
    padding:30px;
}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:24px;
    box-shadow:
    0 10px 40px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.builder{
    padding:28px;
    position:sticky;
    top:30px;
    height:fit-content;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:30px;
}

.logo-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    background:linear-gradient(135deg,#5865f2,#8f5cff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 10px 25px rgba(88,101,242,.4);
}

.logo h1{
    font-size:24px;
    font-weight:700;
}

.logo p{
    color:#9ca3af;
    font-size:14px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
    font-weight:600;
    color:#d1d5db;
}

input,
textarea{
    width:100%;
    border:none;
    outline:none;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.06);
    padding:14px 16px;
    border-radius:16px;
    color:white;
    font-size:15px;
    transition:.25s;
}

textarea{
    resize:none;
    min-height:140px;
}

input:focus,
textarea:focus{
    border-color:#5865f2;
    box-shadow:0 0 0 4px rgba(88,101,242,.15);
}

.row{
    display:grid;
    grid-template-columns:1fr 80px;
    gap:12px;
}

.color-picker{
    padding:4px;
    overflow:hidden;
}

.color-picker input{
    height:52px;
    padding:0;
    border:none;
    background:none;
}

button{
    width:100%;
    border:none;
    padding:16px;
    border-radius:18px;
    cursor:pointer;
    font-size:16px;
    font-weight:700;
    transition:.25s;
}

.send-btn{
    background:linear-gradient(135deg,#5865f2,#8f5cff);
    color:white;
    box-shadow:0 15px 35px rgba(88,101,242,.35);
}

.send-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 20px 45px rgba(88,101,242,.45);
}

.preview-area{
    padding:30px;
}

.preview-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.preview-top h2{
    font-size:28px;
}

.live-badge{
    background:rgba(34,197,94,.15);
    color:#4ade80;
    padding:8px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
}

.discord-ui{
    background:#313338;
    border-radius:24px;
    padding:25px;
    min-height:700px;
    position:relative;
    overflow:hidden;
}

.discord-ui::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.03),
        transparent
    );
    pointer-events:none;
}

.fake-msg{
    display:flex;
    gap:16px;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:linear-gradient(135deg,#5865f2,#8f5cff);
    flex-shrink:0;
}

.msg-content{
    width:100%;
}

.username{
    font-weight:700;
    margin-bottom:10px;
}

.timestamp{
    color:#9ca3af;
    font-size:12px;
    margin-left:8px;
}

.embed{
    background:#2b2d31;
    border-left:5px solid #5865f2;
    border-radius:10px;
    padding:18px;
    max-width:620px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
    animation:fade .25s ease;
}

.embed-author{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    color:#d1d5db;
    font-size:14px;
}

.embed-author img{
    width:24px;
    height:24px;
    border-radius:50%;
}

.embed-title{
    font-size:22px;
    font-weight:700;
    margin-bottom:12px;
}

.embed-desc{
    color:#d1d5db;
    line-height:1.6;
    white-space:pre-wrap;
}

.embed-image{
    margin-top:18px;
    border-radius:12px;
    width:100%;
    display:none;
    max-height:320px;
    object-fit:cover;
}

.footer{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.05);
    display:flex;
    justify-content:space-between;
    color:#9ca3af;
    font-size:13px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:1000px){

.container{
    grid-template-columns:1fr;
}

.builder{
    position:relative;
    top:0;
}

}
</style>
</head>

<body>

<div class="container">

<div class="card builder">

<div class="logo">
<div class="logo-icon">💎</div>

<div>
<h1>Embed Builder</h1>
<p>Modern Discord Webhook Creator</p>
</div>
</div>

<div class="form-group">
<label>Embed Title</label>
<input type="text" id="title" placeholder="Masukkan title embed">
</div>

<div class="form-group">
<label>Description</label>
<textarea id="description" placeholder="Tulis deskripsi embed..."></textarea>
</div>

<div class="form-group">
<label>Image URL</label>
<input type="text" id="image" placeholder="https://image.com/example.png">
</div>

<div class="form-group">
<label>Embed Color</label>

<div class="row">

<input type="text" id="hexInput" value="#5865f2">

<div class="color-picker">
<input type="color" id="color" value="#5865f2">
</div>

</div>
</div>

<button class="send-btn" onclick="sendEmbed()">
🚀 Send Embed
</button>

</div>

<div class="card preview-area">

<div class="preview-top">
<h2>Live Preview</h2>

<div class="live-badge">
● LIVE
</div>
</div>

<div class="discord-ui">

<div class="fake-msg">

<div class="avatar"></div>

<div class="msg-content">

<div class="username">
Webhook Bot
<span class="timestamp">Today at 12:00</span>
</div>

<div class="embed" id="embedBox">

<div class="embed-author">
<img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png">
<span>Discord Embed Builder</span>
</div>

<div class="embed-title" id="previewTitle">
Amazing Embed Title
</div>

<div class="embed-desc" id="previewDesc">
Beautiful modern Discord embed preview with live rendering.
</div>

<img class="embed-image" id="previewImage">

<div class="footer">
<span>Powered by Webhook</span>
<span id="timeNow"></span>
</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

const webhook =
"https://discord.com/api/webhooks/1498139479704211549/Ptyo-NwQiJQi4n2Z_8NbNC-q_qqpl4pC_q4l0FvtJ9v2yCeesKkiq0neJgqin8QNZqdy";

const titleInput = document.getElementById("title");
const descInput = document.getElementById("description");
const imageInput = document.getElementById("image");
const colorInput = document.getElementById("color");
const hexInput = document.getElementById("hexInput");

function updateClock(){

const now = new Date();

document.getElementById("timeNow").innerText =
now.toLocaleTimeString("id-ID",{
hour:'2-digit',
minute:'2-digit'
});

}

setInterval(updateClock,1000);
updateClock();

function updatePreview(){

document.getElementById("previewTitle").innerText =
titleInput.value || "Amazing Embed Title";

document.getElementById("previewDesc").innerText =
descInput.value || "Beautiful modern Discord embed preview with live rendering.";

const embed = document.getElementById("embedBox");

embed.style.borderLeftColor = colorInput.value;

const img = document.getElementById("previewImage");

if(imageInput.value){

img.src = imageInput.value;
img.style.display = "block";

}else{

img.style.display = "none";

}

}

titleInput.addEventListener("input",updatePreview);
descInput.addEventListener("input",updatePreview);
imageInput.addEventListener("input",updatePreview);

colorInput.addEventListener("input",()=>{

hexInput.value = colorInput.value;
updatePreview();

});

hexInput.addEventListener("input",()=>{

colorInput.value = hexInput.value;
updatePreview();

});

function hexToDecimal(hex){
return parseInt(hex.replace("#",""),16);
}

async function sendEmbed(){

const btn = document.querySelector(".send-btn");

btn.innerHTML = "⏳ Sending...";
btn.disabled = true;

const payload = {

embeds:[{

title:titleInput.value,

description:descInput.value,

color:hexToDecimal(colorInput.value),

image:imageInput.value
? { url:imageInput.value }
: undefined,

footer:{
text:"Sent from Modern Embed Builder"
},

timestamp:new Date()

}]

};

try{

const res = await fetch(webhook,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
});

if(res.ok){

btn.innerHTML = "✅ Embed Sent!";

setTimeout(()=>{
btn.innerHTML = "🚀 Send Embed";
btn.disabled = false;
},2000);

}else{

btn.innerHTML = "❌ Failed";

setTimeout(()=>{
btn.innerHTML = "🚀 Send Embed";
btn.disabled = false;
},2000);

}

}catch(err){

btn.innerHTML = "❌ Error";

setTimeout(()=>{
btn.innerHTML = "🚀 Send Embed";
btn.disabled = false;
},2000);

}

}

updatePreview();

</script>

</body>
</html>
