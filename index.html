<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P3TO SYSTEM | NEURAL INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest-deep: #05080a;
            --emerald: #00ffcc; /* Cyan-Emerald yang lebih bercahaya */
            --glass: rgba(10, 15, 20, 0.7);
            --border: rgba(0, 255, 204, 0.15);
            --text-main: #f1f5f9;
            --text-dim: #64748b;
            --accent-glow: rgba(0, 255, 204, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--forest-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05), transparent),
                linear-gradient(to bottom, rgba(5, 8, 10, 0.9), #000),
                url('https://images.unsplash.com/photo-1635776062127-d379bfcba9f8?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* --- BACKGROUND ANIMATION --- */
        .bg-particles {
            position: absolute; width: 100%; height: 100%; z-index: -1;
            background-image: radial-gradient(var(--emerald) 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.05;
            animation: moveBg 20s linear infinite;
        }

        @keyframes moveBg { from { transform: translateY(0); } to { transform: translateY(-50px); } }

        /* --- CONTAINER UTAMA --- */
        .app-shell {
            width: 1200px;
            height: 800px;
            background: var(--glass);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 40px;
            display: grid;
            grid-template-columns: 420px 1fr;
            box-shadow: 0 0 100px rgba(0, 255, 204, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            padding: 50px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
        }

        .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; }
        .brand img {
            width: 55px; height: 55px; border-radius: 15px;
            border: 2px solid var(--emerald);
            box-shadow: 0 0 15px var(--accent-glow);
            object-fit: cover;
        }
        .brand h2 { font-size: 1.2rem; letter-spacing: 2px; text-shadow: 0 0 10px var(--accent-glow); }

        .form-section { flex: 1; overflow-y: auto; padding-right: 15px; }

        .input-group { margin-bottom: 28px; position: relative; }
        .input-group label {
            display: block; font-size: 0.7rem; font-weight: 700;
            color: var(--emerald); margin-bottom: 10px; text-transform: uppercase;
            letter-spacing: 1.5px; opacity: 0.8;
        }

        input, textarea {
            width: 100%; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px;
            padding: 14px 18px; color: #fff; font-size: 0.95rem;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        input:focus, textarea:focus {
            outline: none; border-color: var(--emerald);
            background: rgba(0, 255, 204, 0.03);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .btn-deploy {
            width: 100%; padding: 20px;
            background: linear-gradient(135deg, var(--emerald), #00d4ff);
            color: #000; border: none; border-radius: 18px;
            font-weight: 800; font-size: 0.9rem; letter-spacing: 1px;
            cursor: pointer; transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.2);
        }

        .btn-deploy:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.4);
            filter: brightness(1.1);
        }

        /* --- PREVIEW --- */
        .preview-area {
            padding: 60px; display: flex; flex-direction: column; position: relative;
        }

        .preview-area::after {
            content: 'P3TO ENGINE V.3.0';
            position: absolute; bottom: 40px; right: 50px;
            font-family: 'JetBrains Mono'; font-size: 0.65rem; color: var(--text-dim); opacity: 0.5;
        }

        .discord-card {
            background: #2b2d31; border-radius: 20px; padding: 28px; width: 100%;
            max-width: 580px; box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            border-left: 5px solid var(--emerald);
            margin: auto; transform: scale(1.05);
        }

        .ds-header { display: flex; gap: 18px; margin-bottom: 12px; }
        .ds-avatar { width: 48px; height: 48px; border-radius: 50%; background: #404249; }
        
        .embed-content { margin-left: 66px; }
        .embed-title { font-weight: 700; font-size: 1.1rem; color: #00b0f4; margin-bottom: 6px; }
        .embed-desc { color: #dbdee1; font-size: 0.95rem; line-height: 1.5; }
        .embed-banner { width: 100%; border-radius: 10px; margin-top: 18px; border: 1px solid rgba(255,255,255,0.05); }

        /* Scrollbar */
        .form-section::-webkit-scrollbar { width: 4px; }
        .form-section::-webkit-scrollbar-thumb { background: var(--emerald); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-particles"></div>

    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <img src="eeff593c85e4d36ffb0fa63dfaebcfb5.jpg" alt="Mixo">
                <div>
                    <h2 style="font-family: 'JetBrains Mono';">P3TO.CORE</h2>
                    <p style="font-size: 0.65rem; color: var(--emerald); font-weight: 800; letter-spacing: 1px;">STATUS: SUPREME OPERATOR</p>
                </div>
            </div>

            <div class="form-section">
                <div class="input-group">
                    <label>Neural Title</label>
                    <input type="text" id="title" placeholder="Define the signal...">
                </div>

                <div class="input-group">
                    <label>Transmission Data</label>
                    <textarea id="desc" rows="5" placeholder="Encrypt your message here..."></textarea>
                </div>

                <div class="input-group">
                    <label>Visual Banner (URL)</label>
                    <input type="text" id="banner" placeholder="https://image.link/...">
                </div>

                <div class="input-group">
                    <label>Aura Signature</label>
                    <input type="color" id="color" value="#00ffcc" style="height: 50px; padding: 5px;">
                </div>
            </div>

            <div class="action-area" style="margin-top: 30px;">
                <button class="btn-deploy" id="sendBtn">EXECUTE TRANSMISSION</button>
            </div>
        </aside>

        <main class="preview-area">
            <div style="font-size: 0.7rem; color: var(--emerald); letter-spacing: 3px; font-weight: 700; margin-bottom: 30px;">
                > REAL_TIME_VISUALIZER.EXE
            </div>
            
            <div class="discord-card" id="card">
                <div class="ds-header">
                    <div class="ds-avatar"></div>
                    <div>
                        <span style="font-weight: 700; color: #fff;">P3TO SYSTEM</span>
                        <span style="background: #5865f2; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; font-weight: 800;">BOT</span>
                        <span style="color: #949ba4; font-size: 0.75rem; margin-left: 10px;">Today at 11:55</span>
                    </div>
                </div>
                <div class="embed-content">
                    <div class="embed-title" id="p-title" style="color: var(--emerald);">Awaiting Signal...</div>
                    <div class="embed-desc" id="p-desc">The neural link is stable. Please provide transmission content.</div>
                    <img src="" id="p-banner" class="embed-banner" style="display: none;">
                </div>
            </div>

            <div style="margin-top: auto; font-family: 'JetBrains Mono'; font-size: 0.65rem; display: flex; justify-content: space-between; color: var(--text-dim);">
                <span>ENCRYPTION: AES-256</span>
                <span>SIGNAL: EXCELLENT</span>
            </div>
        </main>
    </div>

    <script>
        // WEBHOOK PERMANEN
        const SECRET_WEBHOOK = "https://discord.com/api/webhooks/1498139479704211549/Ptyo-NwQiJQi4n2Z_8NbNC-q_qqpl4pC_q4l0FvtJ9v2yCeesKkiq0neJgqin8QNZqdy";

        function update() {
            const title = document.getElementById('title').value || "Awaiting Signal...";
            const desc = document.getElementById('desc').value || "The neural link is stable. Please provide transmission content.";
            const color = document.getElementById('color').value;
            const banner = document.getElementById('banner').value;

            document.getElementById('p-title').innerText = title;
            document.getElementById('p-title').style.color = color;
            document.getElementById('p-desc').innerText = desc;
            document.getElementById('card').style.borderColor = color;
            
            const imgEl = document.getElementById('p-banner');
            if(banner) {
                imgEl.src = banner;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
        }

        ['title', 'desc', 'color', 'banner'].forEach(id => {
            document.getElementById(id).addEventListener('input', update);
        });

        document.getElementById('sendBtn').onclick = async () => {
            const btn = document.getElementById('sendBtn');
            const title = document.getElementById('title').value;
            const desc = document.getElementById('desc').value;

            if(!title || !desc) return alert("System Error: Content is required for transmission.");

            btn.innerText = "ESTABLISHING LINK...";
            btn.style.background = "#fff";
            btn.disabled = true;

            const payload = {
                embeds: [{
                    title: title,
                    description: desc,
                    color: parseInt(document.getElementById('color').value.replace('#',''), 16),
                    image: { url: document.getElementById('banner').value },
                    footer: { text: "OPERATED BY MIXO // P3TO CORE" },
                    timestamp: new Date().toISOString()
                }]
            };

            try {
                const res = await fetch(SECRET_WEBHOOK, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    btn.innerText = "SUCCESSFULLY TRANSMITTED";
                    btn.style.background = "var(--emerald)";
                    setTimeout(() => {
                        btn.innerText = "EXECUTE TRANSMISSION";
                        btn.disabled = false;
                    }, 3000);
                }
            } catch(e) {
                alert("Neural link failed. Check connection.");
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
